apiVersion: v1
kind: Service
metadata:
  name: vector-poc-backend
  namespace: vector-poc
  labels:
    app: vector-poc-backend
spec:
  type: LoadBalancer
  selector:
    app: vector-poc-backend
  ports:
  - port: 9000
    targetPort: 9000
    protocol: TCP
    name: http
---
# Alternative NodePort service for simpler local access
apiVersion: v1
kind: Service
metadata:
  name: vector-poc-backend-nodeport
  namespace: vector-poc
  labels:
    app: vector-poc-backend
spec:
  type: NodePort
  selector:
    app: vector-poc-backend
  ports:
  - port: 9000
    targetPort: 9000
    nodePort: 30900
    protocol: TCP
    name: http