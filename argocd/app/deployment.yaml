apiVersion: apps/v1
kind: Deployment
metadata:
  name: vector-poc-backend
  namespace: vector-poc
  labels:
    app: vector-poc-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vector-poc-backend
  template:
    metadata:
      labels:
        app: vector-poc-backend
    spec:
      containers:
      - name: backend
        image: vector-poc-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9000
          name: http
          protocol: TCP
        env:
        - name: JAVA_OPTS
          value: "-Xmx512m -Xms256m"
        - name: SERVER_PORT
          value: "9000"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "768Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /healthcheck
            port: 9000
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthcheck
            port: 9000
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3