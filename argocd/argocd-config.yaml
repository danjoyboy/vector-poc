apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cmd-params-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cmd-params-cm
    app.kubernetes.io/part-of: argocd
data:
  # Enable terminal/exec access in ArgoCD UI
  server.exec.enabled: "true"

  # Optional: Additional ArgoCD server configurations
  # server.insecure: "false"
  # server.disable.auth: "false"
  # server.rbac.log.enforce.enable: "false"
---
# RBAC configuration to allow exec access
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argocd-server-exec
rules:
- apiGroups: [""]
  resources: ["pods/exec"]
  verbs: ["create", "get"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argocd-server-exec
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argocd-server-exec
subjects:
- kind: ServiceAccount
  name: argocd-server
  namespace: argocd