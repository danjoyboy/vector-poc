apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: vector-poc
  labels:
    app: postgres
    component: database
spec:
  type: NodePort
  selector:
    app: postgres
    component: database
  ports:
  - port: 5432
    targetPort: 5432
    nodePort: 30432
    protocol: TCP
    name: postgres