apiVersion: v1
kind: Service
metadata:
  name: vector-poc-backend-sidecar
  namespace: vector-poc
  labels:
    app: vector-poc-backend
    version: with-sidecar
spec:
  type: ClusterIP
  selector:
    app: vector-poc-backend
    version: with-sidecar
  ports:
  - port: 9000
    targetPort: 9000
    protocol: TCP
    name: http
---
# NodePort service for external access
apiVersion: v1
kind: Service
metadata:
  name: vector-poc-backend-sidecar-nodeport
  namespace: vector-poc
  labels:
    app: vector-poc-backend
    version: with-sidecar
spec:
  type: NodePort
  selector:
    app: vector-poc-backend
    version: with-sidecar
  ports:
  - port: 9000
    targetPort: 9000
    nodePort: 30901
    protocol: TCP
    name: http
---
# Headless service for Vector API access (optional)
apiVersion: v1
kind: Service
metadata:
  name: vector-api
  namespace: vector-poc
  labels:
    app: vector-poc-backend
    component: vector
spec:
  type: ClusterIP
  clusterIP: None  # Headless service
  selector:
    app: vector-poc-backend
    version: with-sidecar
  ports:
  - port: 8686
    targetPort: 8686
    protocol: TCP
    name: vector-api