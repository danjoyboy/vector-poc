apiVersion: apps/v1
kind: Deployment
metadata:
  name: vector-poc-backend-with-sidecar
  namespace: vector-poc
  labels:
    app: vector-poc-backend
    version: with-sidecar
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vector-poc-backend
      version: with-sidecar
  template:
    metadata:
      labels:
        app: vector-poc-backend
        version: with-sidecar
    spec:
      # Shared volumes
      volumes:
      - name: app-logs
        emptyDir: {}
      - name: vector-config
        configMap:
          name: vector-config
      - name: vector-data
        emptyDir: {}

      containers:
      # Main Spring Boot application
      - name: backend
        image: vector-poc-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9000
          name: http
          protocol: TCP
        env:
        - name: JAVA_OPTS
          value: "-Xmx512m -Xms256m"
        - name: SERVER_PORT
          value: "9000"
        - name: KUBERNETES_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        resources:
          requests:
            memory: "384Mi"
            cpu: "250m"
          limits:
            memory: "768Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /healthcheck
            port: 9000
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthcheck
            port: 9000
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: app-logs
          mountPath: /var/log/app
        command: ["/bin/sh"]
        args: ["-c", "java -jar /runtime/app.jar 2>&1 | tee -a /var/log/app/app.log"]

      # Vector sidecar with PostgreSQL support
      - name: vector
        image: timberio/vector:latest-debian
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8686
          name: vector-api
          protocol: TCP
        env:
        - name: VECTOR_LOG
          value: "info"
        - name: KUBERNETES_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: HOSTNAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        # PostgreSQL environment variables from secret
        - name: POSTGRES_HOST
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: POSTGRES_HOST
        - name: POSTGRES_PORT
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: POSTGRES_PORT
        - name: POSTGRES_DATABASE
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: POSTGRES_DATABASE
        - name: POSTGRES_TABLE
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: POSTGRES_TABLE
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: POSTGRES_PASSWORD
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8686
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8686
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: app-logs
          mountPath: /var/log/app
          readOnly: true
        - name: vector-config
          mountPath: /etc/vector
          readOnly: true
        - name: vector-data
          mountPath: /var/lib/vector
        command:
        - vector
        - --config
        - /etc/vector/vector.yaml

      # Anti-affinity to spread pods across nodes
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - vector-poc-backend
              topologyKey: kubernetes.io/hostname